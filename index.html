      // ムチ：振り上げて、馬のお尻に入れる
      const a = Math.sin(ph * 2) * 0.9;
      c.strokeStyle = '#1b1b1b'; c.lineWidth = 1.4;
      c.beginPath(); c.moveTo(-2, -22); c.lineTo(-2 - Math.cos(a) * 16, -22 - Math.sin(a) * 16 - 4); c.stroke();
    }
    c.restore();
  }

  // 色を明るく（+）／暗く（−）
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt))));
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  }

  // ---------- 払い戻し ----------
  function settle(order) {
    const H = s.race.horses;
    const total = staked();
    const first = order[0], second = order[1], top3 = order.slice(0, 3);
    let returned = 0;
    const hits = [];
    for (const b of s.bets) {
      const o = oddsOf(b);
      let hit = false;
      if (b.type === 'win') hit = b.sel[0] === first;
      else if (b.type === 'place') hit = top3.includes(b.sel[0]);
      else hit = b.sel.includes(first) && b.sel.includes(second);
      if (hit) { returned += Math.floor(b.amt * o); hits.push(`${typeJa[b.type]} ${b.sel.map(i => i + 1).join('-')}（${o}倍）`); }
    }
    const before = Save.get().balance;
    if (returned) Save.pay(returned);
    const after = Save.get().balance;
    const net = returned - total;
    Save.recordPlay('keiba', net > 0);

    s.phase = 'result';
    s.order = order;
    render();

    const line = top3.map((i, k) => `${k + 1}着 ${i + 1}番`).join('・');
    let kind, title, sub;
    if (net > 0 && net >= total * 5) { kind = 'bigwin'; title = '大穴的中!!'; sub = line; }
    else if (net > 0) { kind = 'win'; title = 'YOU WIN!'; sub = line; }
    else if (net < 0) { kind = 'lose'; title = 'ハズレ…'; sub = line; }
    else { kind = 'push'; title = 'トントン'; sub = line; }
    ({ bigwin: Sound.bigwin, win: Sound.win, lose: Sound.lose, push: Sound.push })[kind]();

    let note = hits.length ? '的中：' + hits.join('、') : '';
    if (after <= 0) { Save.reset(); note = `所持金がなくなりました。${fmt(Save.START)} BONから再スタートします`; }
    setTimeout(() => Result.show({
      kind, title, sub, net, before, after, note, returned, staked: total,
      onNext: () => {
        s.raceNo++; s.race = makeRace(s.raceNo); s.phase = 'bet'; s.bets = []; s.undo = []; s.pick = null; s.order = null;
        render(); window.scrollTo({ top: 0, behavior: 'smooth' });
      },
      onLobby: () => s.onBack(),
    }), 1500);
  }

  // ---------- 画面 ----------
  const noTag = h => `<span class="kb-no" style="background:${WAKU[h.no - 1]};color:${WAKU_TEXT[h.no - 1]}">${h.no}</span>`;
  const formMark = f => f > 0.004 ? '◎' : f > 0 ? '○' : f > -0.004 ? '△' : '▲';

  function render() {
    const H = s.race.horses, total = staked(), bal = Save.get().balance;
    const betting = s.phase === 'bet';
    const rows = H.map((h, i) => {
      let odds, amt = 0, cls = '';
      if (s.type === 'quinella') {
        if (s.pick === i) { odds = '軸'; cls = 'pick'; }
        else if (s.pick != null) odds = s.race.pairOdds[[s.pick, i].sort((a, b) => a - b).join('-')];
        else odds = '—';
        if (s.pick != null && s.pick !== i) {
          const key = 'quinella:' + [s.pick, i].sort((a, b) => a - b).join('-');
          amt = (s.bets.find(b => betKey(b) === key) || {}).amt || 0;
        }
      } else {
        odds = s.type === 'win' ? h.win : h.place;
        amt = (s.bets.find(b => betKey(b) === s.type + ':' + i) || {}).amt || 0;
      }
      const place = s.order ? s.order.indexOf(i) + 1 : 0;
      return `<button class="kb-row ${cls} ${place && place <= 3 ? 'top' + place : ''}" data-i="${i}" ${betting ? '' : 'disabled'}>
        ${noTag(h)}
        <span class="kb-name"><b>${h.name}</b><small>${STYLES[h.style].label}・調子${formMark(h.form)}・${h.pop}番人気</small></span>
        <span class="kb-odds">${typeof odds === 'number' ? odds.toFixed(1) : odds}${typeof odds === 'number' ? '<small>倍</small>' : ''}</span>
        ${place ? `<span class="kb-place">${place}着${place > 1 && s.margins ? `<small>${s.margins[place - 1]}</small>` : ''}</span>` : amt ? `<span class="pchip">${short(amt)}</span>` : '<span class="kb-empty"></span>'}
      </button>`;
    }).join('');

    const betList = s.bets.length ? s.bets.map(b => `<li><span>${typeJa[b.type]}</span><b>${b.sel.map(i => i + 1).join('-')}</b><span>${oddsOf(b).toFixed(1)}倍</span><span>${fmt(b.amt)}</span></li>`).join('') : '<li class="empty">まだ馬券を買っていません</li>';
    const hint = s.type === 'quinella'
      ? (s.pick == null ? 'まず1頭目をタップ。次に2頭目をタップすると、その組み合わせを買います' : `${s.pick + 1}番と組み合わせる馬をタップ（もう一度${s.pick + 1}番で解除）`)
      : s.type === 'win' ? '1着になると思う馬をタップ' : '3着以内に入ると思う馬をタップ';

    root.innerHTML = `
      <div class="game-head">
        <button class="back-btn" id="back">← もどる</button>
        <h2>競馬</h2><span style="width:60px"></span>
      </div>
      <div class="kb-race">第${s.raceNo}レース　<b>BONカップ</b>　芝${DIST}m・8頭</div>
      <div class="kb-stage">
        <canvas class="kb-canvas" width="720" height="400" aria-label="レースの様子"></canvas>
        ${s.phase === 'race' ? `<div class="kb-cams" role="group" aria-label="カメラの切り替え">${CAMS.map(cm =>
          `<button data-cam="${cm.id}" class="${s.cam === cm.id ? 'on' : ''}" ${cm.id === 'mine' && myHorse() < 0 ? 'disabled' : ''}>${cm.label}</button>`).join('')}</div>` : ''}
        <div class="kb-call" aria-live="polite">${s.phase === 'bet' ? 'パドックで馬を見て、馬券を買いましょう'
          : s.order ? s.order.slice(0, 3).map((i, k) => `${k + 1}着 ${noTag(H[i])}`).join('　') : ''}</div>
      </div>
      ${betting ? `
      <div class="tabs kb-tabs" role="tablist">
        ${['win', 'place', 'quinella'].map(t => `<button role="tab" data-t="${t}" class="${s.type === t ? 'on' : ''}">${typeJa[t]}</button>`).join('')}
      </div>
      <p class="rt-hint" style="margin:8px 0">${hint}</p>` : ''}
      <div class="kb-list">${rows}</div>
      ${betting ? `
      <ul class="kb-bets">${betList}</ul>
      <div class="bet-amount">合計<b>${fmt(total)}</b></div>
      <div class="bet-row">${[100, 500, 1000, 5000].map(v => `<button class="chip c${v} ${s.chip === v ? 'sel' : ''}" data-chip="${v}">${short(v)}</button>`).join('')}</div>
      <div class="action-row four">
        <button class="btn ghost" id="undo" ${s.undo.length ? '' : 'disabled'}>1つ戻す</button>
        <button class="btn ghost" id="clear" ${total ? '' : 'disabled'}>クリア</button>
        <button class="btn ghost" id="rebet" ${s.last && !total ? '' : 'disabled'}>前回と同じ</button>
        <button class="btn" id="go" ${total && total <= bal ? '' : 'disabled'}>レース開始</button>
      </div>` : ''}`;

    if (s.phase === 'bet' || s.phase === 'result') drawIdle();
    const on = (id, fn) => { const b = root.querySelector('#' + id); if (b) b.onclick = fn; };
    on('back', () => s.phase === 'race' ? App.toast('レース中は戻れません') : s.onBack());
    root.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { s.type = b.dataset.t; s.pick = null; Sound.tap(); render(); });
    root.querySelectorAll('.kb-row').forEach(b => b.onclick = () => {
      const i = Number(b.dataset.i);
      if (s.type !== 'quinella') return addBet(s.type, [i]);
      if (s.pick == null) { s.pick = i; Sound.tap(); return render(); }
      if (s.pick === i) { s.pick = null; Sound.tap(); return render(); }
      addBet('quinella', [s.pick, i].sort((a, b) => a - b));
    });
    root.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { s.chip = Number(b.dataset.chip); Sound.tap(); render(); });
    on('undo', () => {
      const [key, amt] = s.undo.pop();
      const b = s.bets.find(x => betKey(x) === key);
      if (b) { b.amt -= amt; if (b.amt <= 0) s.bets.splice(s.bets.indexOf(b), 1); }
      Sound.tap(); render();
    });
    on('clear', () => { s.bets = []; s.undo = []; Sound.tap(); render(); });
    on('rebet', () => {
      // 前のレースと同じ馬番・券種で買う（オッズは今のレースのもの）
      const need = s.last.reduce((a, b) => a + b.amt, 0);
      if (need > bal) return App.toast('所持金が足りません');
      s.bets = s.last.map(b => ({ ...b, sel: [...b.sel] }));
      s.undo = s.bets.map(b => [betKey(b), b.amt]);
      Sound.chip(); render();
    });
    on('go', run);
    root.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => {
      s.cam = b.dataset.cam; Sound.tap();
      root.querySelectorAll('[data-cam]').forEach(x => x.classList.toggle('on', x === b));
    });
  }

  // 待っている間のコース（ゲートの中、またはゴール後の様子）
  function drawIdle() {
    const canvas = root.querySelector('.kb-canvas');
    const ctx = canvas.getContext('2d');
    const st = newState();
    const view = { z: 1, fy: 0 };
    if (s.order) {
      s.order.forEach((i, k) => { st.x[i] = DIST + 30 - k * 3.2; });
      st.finish = [...s.order]; st.started = true; st.gate = 1;
      view.cam = (DIST + 30) * PX - canvas.width * 0.7;
    } else {
      st.x.fill(-6); view.cam = -6 * PX - canvas.width * 0.35;
    }
    drawScene(ctx, canvas.width, canvas.height, view, st, s.race.horses, 0, myHorse());
  }

  return { open, _makeRace: makeRace };
})();

</script>
<script>
// 画面の切り替え：タイトル → メニュー → 各画面
const App = (() => {
  const app = document.getElementById('app');
  const topbar = document.getElementById('topbar');
  const fmt = n => n.toLocaleString('ja-JP');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const GAMES = [
    { id: 'blackjack', name: 'ブラックジャック', icon: '🃏', desc: '21を目指せ', ready: true, open: () => Blackjack.open(app, solo) },
    { id: 'roulette', name: 'ルーレット', icon: '🎡', desc: '赤か黒か', ready: true, open: () => Roulette.open(app, solo) },
    { id: 'poker', name: 'ポーカー', icon: '♠️', desc: 'テキサスホールデム' },
    { id: 'baccarat', name: 'バカラ', icon: '🎴', desc: 'プレイヤー or バンカー', ready: true, open: () => Baccarat.open(app, solo) },
    { id: 'chinchiro', name: 'チンチロ', icon: '🎲', desc: 'サイコロ3つで勝負', ready: true, open: () => Chinchiro.open(app, solo) },
    { id: 'keiba', name: '競馬', icon: '🏇', desc: '1着を当てろ', ready: true, open: () => Keiba.open(app, solo) },
    { id: 'pachinko', name: 'パチンコ', icon: '🔮', desc: '1人用' },
    { id: 'slot', name: 'パチスロ', icon: '🎰', desc: '1人用' },
  ];

  // ---------- 共通パーツ ----------
  function avatar(p, size = 44) {
    const style = `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.45)}px`;
    return p.icon
      ? `<img class="avatar" src="${p.icon}" alt="" style="${style}">`
      : `<span class="avatar" style="${style}">${esc((p.name || '?').slice(0, 1))}</span>`;
  }

  function screen(title, html, back = menu) {
    topbar.hidden = false;
    app.className = 'page';
    app.innerHTML = `
      <div class="page-head">
        <button class="back-btn" id="pageBack">← もどる</button>
        <h2>${title}</h2><span></span>
      </div>${html}`;
    app.querySelector('#pageBack').onclick = () => { Sound.tap(); back(); };
    window.scrollTo(0, 0);
  }

  // ページ内の確認ダイアログ（ブラウザのconfirmは使わない）
  function ask(text, okLabel, onOk) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <p>${text}</p>
        <div class="action-row">
          <button class="btn ghost" data-a="no">やめる</button>
          <button class="btn red" data-a="ok">${okLabel}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    wrap.onclick = e => {
      const a = e.target.dataset.a;
      if (a || e.target === wrap) wrap.remove();
      if (a === 'ok') onOk();
    };
  }

  // ---------- タイトル ----------
  function title() {
    topbar.hidden = true;
    app.className = 'title-screen';
    app.innerHTML = `
      <div class="title-inner">
        <div class="title-suits" aria-hidden="true"><span>♠</span><span>♥</span><span>♦</span><span>♣</span></div>
        <h1 class="title-logo">BON!</h1>
        <div class="title-sub">CASINO party</div>
        <div class="tap">TAP TO START</div>
      </div>`;
    app.onclick = () => {
      app.onclick = null;
      Sound.unlock(); Sound.start();
      menu();
    };
  }

  // ---------- メニュー ----------
  function menu() {
    topbar.hidden = false;
    app.className = 'page';
    const d = Save.get(), p = d.profile;
    const item = (id, icon, name, sub, big) => `
      <button class="menu-btn ${big ? 'big' : ''}" data-go="${id}">
        <span class="menu-icon" aria-hidden="true">${icon}</span>
        <span><b>${name}</b><small>${sub}</small></span>
      </button>`;
    app.innerHTML = `
      <button class="me-card" data-go="friends">
        ${avatar(p, 52)}
        <span class="me-text"><b>${esc(p.name)}</b><small>フレンドコード ${p.code}</small></span>
        <span class="me-bal"><small>1人プレイ所持金</small><b>${fmt(d.balance)}</b></span>
      </button>
      <div class="menu-grid">
        ${item('room', '👥', 'ルーム', '最大6人で遊ぶ', true)}
        ${item('solo', '🎰', '1人で遊ぶ', '続きから遊べる', true)}
        ${item('friends', '🤝', 'フレンド', '一覧・プロフ')}
        ${item('ranking', '🏆', 'ランキング', '順位を見る')}
        ${item('settings', '⚙️', '設定', '音量など')}
      </div>`;
    app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
      Sound.tap();
      ({ room, solo, friends, ranking, settings })[b.dataset.go]();
    });
    window.scrollTo(0, 0);
  }

  // ---------- ルーム ----------
  function room() {
    let money = 25000;
    const draw = () => {
      screen('ルーム', `
        <div class="sheet">
          <h3>ルームを作る</h3>
          <p>友達を最大6人まで呼んで遊べます。遊ぶゲームとベットは、全員がそろってから選びます。</p>
          <div class="field"><label>スタート時の持ち金</label>
            <div class="seg">${[5000, 10000, 25000, 50000].map(v =>
              `<button data-m="${v}" class="${v === money ? 'on' : ''}">${fmt(v)}</button>`).join('')}</div>
          </div>
          <button class="btn" style="width:100%" disabled>ルームを作成</button>
        </div>
        <div class="sheet">
          <h3>ルームに参加</h3>
          <p>友達から聞いたルーム番号を入力してください。</p>
          <div class="input-row">
            <input id="roomCode" inputmode="numeric" maxlength="6" placeholder="6けたの番号" disabled>
            <button class="btn" disabled>参加</button>
          </div>
        </div>
        <div class="notice">🔒 ルームはオンライン機能（ログイン）を追加すると使えるようになります。</div>`);
      app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { money = Number(b.dataset.m); Sound.tap(); draw(); });
    };
    draw();
  }

  // ---------- 1人で遊ぶ ----------
  function solo() {
    const d = Save.get();
    screen('1人で遊ぶ', `
      <div class="stats">
        <div class="stat"><b>${fmt(d.balance)}</b><small>現在の所持金</small></div>
        <div class="stat"><b>${fmt(d.maxBalance)}</b><small>最大所持金</small></div>
        <div class="stat"><b>${d.resetCount}</b><small>リセット回数</small></div>
      </div>
      <div class="game-grid">
        ${GAMES.map(g => `
          <button class="game-card" data-id="${g.id}" ${g.ready ? '' : 'disabled'}>
            <span class="badge ${g.ready ? 'live' : ''}">${g.ready ? 'PLAY' : '準備中'}</span>
            <span class="icon">${g.icon}</span>
            <b>${g.name}</b><small>${g.desc}</small>
          </button>`).join('')}
      </div>
      <button class="text-btn" id="resetBtn">所持金をリセットする</button>`);
    app.querySelectorAll('.game-card').forEach(b => b.onclick = () => {
      Sound.tap();
      GAMES.find(g => g.id === b.dataset.id).open();
      window.scrollTo(0, 0);
    });
    app.querySelector('#resetBtn').onclick = () =>
      ask(`所持金を ${fmt(Save.START)} BON に戻します。リセット回数が1回増えます。`, 'リセット', () => {
        Save.reset(); toast('リセットしました'); solo();
      });
  }

  // ---------- フレンド ----------
  function friends() {
    const d = Save.get(), p = d.profile;
    const titles = [];
    if ((d.plays.poker || 0) >= 100) titles.push('ポーカーマスター');
    screen('フレンド', `
      <div class="sheet profile">
        <div class="profile-top">
          ${avatar(p, 72)}
          <div class="profile-name">
            <b>${esc(p.name)}</b>
            <small>フレンドコード</small>
            <span class="code">${p.code}</span>
          </div>
        </div>
        <div class="titles">${titles.length ? titles.map(t => `<span class="title-chip">${t}</span>`).join('') : '<span class="title-chip empty">称号はまだありません</span>'}</div>
        <dl class="kv">
          <div><dt>現在の所持金</dt><dd>${fmt(d.balance)} BON</dd></div>
          <div><dt>最大所持金</dt><dd>${fmt(d.maxBalance)} BON</dd></div>
          <div><dt>リセット回数</dt><dd>${d.resetCount} 回</dd></div>
          <div><dt>総プレイ回数</dt><dd>${Save.totalPlays()} 回</dd></div>
        </dl>
        <button class="btn ghost" id="editBtn" style="width:100%">プロフィールを編集</button>
      </div>
      <div class="sheet">
        <h3>フレンド一覧</h3>
        <div class="input-row">
          <input id="friendCode" placeholder="フレンドコード（例 ABCD-1234）" disabled>
          <button class="btn" disabled>追加</button>
        </div>
        <div class="empty-state">まだフレンドがいません。<br>ログイン機能を追加すると、フレンドコードで友達を追加できます。</div>
      </div>`);
    app.querySelector('#editBtn').onclick = () => { Sound.tap(); editProfile(); };
  }

  function editProfile() {
    const p = Save.get().profile;
    let icon = p.icon;
    screen('プロフィール編集', `
      <div class="sheet">
        <div class="icon-pick">
          <span id="iconPreview">${avatar({ ...p, icon }, 96)}</span>
          <label class="btn ghost" for="iconFile">アイコンを選ぶ</label>
          <input type="file" id="iconFile" accept="image/*" hidden>
          <button class="text-btn" id="iconClear" style="margin:0">アイコンを外す</button>
        </div>
        <div class="field"><label for="nameInput">名前（12文字まで）</label>
          <input id="nameInput" maxlength="12" value="${esc(p.name)}">
        </div>
        <button class="btn" id="saveBtn" style="width:100%">保存</button>
      </div>`, friends);

    const preview = () => {
      app.querySelector('#iconPreview').innerHTML =
        avatar({ name: app.querySelector('#nameInput').value || p.name, icon }, 96);
    };
    app.querySelector('#nameInput').oninput = preview;
    app.querySelector('#iconClear').onclick = () => { icon = ''; preview(); };
    app.querySelector('#iconFile').onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      resizeImage(file, 160).then(url => { icon = url; preview(); })
        .catch(() => toast('この画像は読み込めませんでした。別の画像を選んでください'));
    };
    app.querySelector('#saveBtn').onclick = () => {
      const name = app.querySelector('#nameInput').value.trim();
      if (!name) return toast('名前を入力してください');
      Save.setProfile({ name, icon });
      Sound.win();
      toast('保存しました');
      friends();
    };
  }

  // 端末の画像を小さな正方形に縮小（データベースに直接保存できるサイズにする）
  function resizeImage(file, size) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const s = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  // ---------- ランキング ----------
  function ranking(tab = 'now') {
    const d = Save.get(), p = d.profile;
    const rows = [{ ...p, now: d.balance, max: d.maxBalance, me: true }]; // フレンド追加後はここに並ぶ
    rows.sort((a, b) => b[tab] - a[tab]);
    screen('ランキング', `
      <div class="tabs" role="tablist">
        <button role="tab" data-t="now" class="${tab === 'now' ? 'on' : ''}">現在所持金</button>
        <button role="tab" data-t="max" class="${tab === 'max' ? 'on' : ''}">最大所持金</button>
      </div>
      <ol class="rank-list">
        ${rows.map((r, i) => `
          <li class="${r.me ? 'me' : ''}">
            <span class="rank-no r${i + 1}">${i + 1}</span>
            ${avatar(r, 40)}
            <span class="rank-name">${esc(r.name)}${r.me ? ' <small>（あなた）</small>' : ''}</span>
            <span class="rank-val">${fmt(r[tab])}</span>
          </li>`).join('')}
      </ol>
      <div class="notice">フレンドを追加すると、1人プレイの所持金でフレンドと順位を競えます。</div>`);
    app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { Sound.tap(); ranking(b.dataset.t); });
  }

  // ---------- 設定 ----------
  function settings() {
    const st = Save.get().settings;
    screen('設定', `
      <div class="sheet">
        <h3>サウンド</h3>
        <div class="field"><label for="bgm">BGM <span id="bgmVal">${st.bgm}</span></label>
          <input type="range" id="bgm" min="0" max="100" step="5" value="${st.bgm}">
          <small class="hint">BGMは今後追加します</small>
        </div>
        <div class="field"><label for="se">効果音 <span id="seVal">${st.se}</span></label>
          <input type="range" id="se" min="0" max="100" step="5" value="${st.se}">
        </div>
        <label class="switch-row">
          <span>勝ったときに振動する</span>
          <input type="checkbox" id="vib" ${st.vibrate ? 'checked' : ''}>
        </label>
      </div>
      <div class="sheet">
        <h3>アカウント</h3>
        <p>Googleでログインすると、別の端末でも続きから遊べてフレンド機能が使えます（準備中）。</p>
        <button class="btn ghost" style="width:100%" disabled>Googleでログイン</button>
      </div>
      <div class="sheet">
        <h3>このゲームについて</h3>
        <p>BONはゲーム内だけで使うコインです。現金への交換や購入はできません。</p>
      </div>`);
    const bind = (id, key) => {
      const el = app.querySelector('#' + id);
      el.oninput = () => { app.querySelector('#' + id + 'Val').textContent = el.value; Save.setSetting(key, Number(el.value)); };
      el.onchange = () => Sound.chip();
    };
    bind('bgm', 'bgm'); bind('se', 'se');
    app.querySelector('#vib').onchange = e => Save.setSetting('vibrate', e.target.checked);
  }

  // ---------- トースト ----------
  let toastTimer;
  function toast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  Save.onChange(d => { document.getElementById('balance').textContent = fmt(d.balance); });
  document.getElementById('homeBtn').onclick = () => {
    if (app.querySelector('#hit')) return toast('ゲーム中は戻れません');
    Sound.tap(); menu();
  };
  title();

  return { toast, menu, solo };
})();

</script>
</body>
</html>
